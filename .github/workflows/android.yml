name: Build MCC VIP Lab (debug only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**','build.gradle','settings.gradle','gradle.properties','.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    name: Android debug APK + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build test APK and test entitlement fixture
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify module metadata and scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          from zipfile import ZipFile
          p='app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(p) as z:
              for name in ('assets/xposed_init','assets/xposed_scope'):
                  assert name in z.namelist(), f'missing {name}'
              assert z.read('assets/xposed_scope').decode().strip() == 'br.art.code.meucronogramacapilar'
              assert z.read('assets/xposed_init').decode().strip() == 'dev.mikey.mccviplab.HookEntry'
          print('MCC_VIP_LAB_PACKAGING_AND_SCOPE_PASS')
          PYVERIFY
      - name: Upload debug APK and unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcc-vip-lab-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/**
          if-no-files-found: warn
