name: Build MCC VIP Lab (debug only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'scripts/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    name: Android debug APK + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 Node24
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5 Node24
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 Node24
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK (v4)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4 Node24
      - name: Install Android SDK platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Java-17 Xposed API stubs with verified runtime descriptors
        run: python3 scripts/rebuild_xposed_stubs.py
      - name: Verify Android toolchain pins
        run: python3 scripts/verify_android_toolchain.py
      - name: Verify LSPosed recommended scope and read-only ad QA
        run: python3 scripts/verify_mcc_ad_qa.py
      - name: P02 sanitized runtime tracing and synthetic reward regression tests
        run: |
          python3 scripts/verify_mcc_p02.py
          python3 -m unittest discover -s scripts -p 'test_mcc_*.py' -v
      - name: Verify P03 scoped local observations and safe toggles
        run: python3 scripts/verify_mcc_p03.py
      - name: P03 offline log-correlation regressions
        run: python3 -m unittest discover -s scripts -p 'test_mcc_p03*.py' -v
      - name: Build test APK and test entitlement fixture
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify module metadata and scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          from zipfile import ZipFile
          p='app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(p) as z:
              for name in ('assets/xposed_init','assets/xposed_scope'):
                  assert name in z.namelist(), f'missing {name}'
              assert z.read('assets/xposed_scope').decode().strip() == 'br.art.code.meucronogramacapilar'
              assert z.read('assets/xposed_init').decode().strip() == 'dev.mikey.mccviplab.HookEntry'
          print('MCC_VIP_LAB_PACKAGING_AND_SCOPE_PASS')
          PYVERIFY
      - name: Upload debug APK and unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcc-vip-lab-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/**
          if-no-files-found: warn
