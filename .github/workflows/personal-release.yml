name: MCC VIP Lab Personal Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personal-release:
    name: Signed personal APK (manual only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Android SDK platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify source contracts and prepare Xposed API stubs
        run: |
          python3 scripts/rebuild_xposed_stubs.py
          python3 scripts/verify_android_toolchain.py
          python3 scripts/verify_mcc_p10.py
          python3 scripts/verify_personal_release.py
          python3 -m unittest discover -s scripts -p 'test_mcc_*.py' -v
      - name: Load personal signing material from GitHub encrypted secrets
        env:
          STORE_B64: ${{ secrets.MCC_PERSONAL_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.MCC_PERSONAL_STORE_PASSWORD }}
          ALIAS: ${{ secrets.MCC_PERSONAL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MCC_PERSONAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$STORE_B64" "$STORE_PASS" "$ALIAS" "$KEY_PASS"; do
            test -n "$value" || { echo 'PERSONAL_SIGNING_SECRETS_MISSING'; exit 1; }
          done
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/mcc-personal.jks"
          chmod 600 "$RUNNER_TEMP/mcc-personal.jks"
          echo "MCC_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/mcc-personal.jks" >> "$GITHUB_ENV"
          echo "MCC_SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "MCC_SIGNING_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "MCC_SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
      - name: Hosted unit tests and signed release APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease
      - name: Validate signed APK and scope
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          python3 - <<'PYVERIFY'
          import zipfile
          p='app/build/outputs/apk/release/app-release.apk'
          with zipfile.ZipFile(p) as z:
            assert z.read('assets/xposed_scope').decode().strip() == 'br.art.code.meucronogramacapilar'
            assert z.read('assets/xposed_init').decode().strip() == 'dev.mikey.mccviplab.HookEntry'
          print('MCC_PERSONAL_RELEASE_PACKAGE_SCOPE_PASS')
          PYVERIFY
          sha256sum "$APK"
      - name: Upload personal-release artifact (not a public GitHub release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mcc-personal-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
